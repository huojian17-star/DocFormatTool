<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #0c1018;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 48px;
      }
      .accent-bar { position: absolute; top: 0; left: 0; right: 0; height: 16px; background: #ffbe3c; }
      .big { font-size: 120px; font-weight: 900; color: #f5f5f5; letter-spacing: 6px; }
      .accent { font-size: 120px; font-weight: 900; color: #ffbe3c; letter-spacing: 6px; }
      .mid { font-size: 56px; color: #c8cdd7; letter-spacing: 3px; }
      .small { font-size: 44px; color: #8a93a3; letter-spacing: 2px; }
      .row { display: flex; align-items: baseline; gap: 28px; }
      .dot { width: 26px; height: 26px; border-radius: 50%; background: #ffbe3c; display: inline-block; }
      .logo { font-size: 84px; font-weight: 900; color: #ffbe3c; letter-spacing: 4px; }
      .line { width: 180px; height: 6px; background: #ffbe3c; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="promo" data-start="0" data-duration="30"
         data-width="1080" data-height="1920">

      <!-- 场景1 0-3.5s：论文格式 改吐了？ -->
      <div class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s1 big">论文格式</div>
        <div class="s1a accent">改吐了？</div>
      </div>

      <!-- 场景2 3.5-7s：痛点 -->
      <div class="scene clip" data-start="3.5" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s2 big" style="font-size:88px">字体乱、行距错</div>
        <div class="s2a big" style="font-size:88px">页码对不上</div>
        <div class="s2b mid">表格里字五花八门</div>
        <div class="s2c accent">改格式比写正文还累</div>
      </div>

      <!-- 场景3 7-10.5s：产品 + 三步 -->
      <div class="scene clip" data-start="7" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s3 logo">规范文档一键排版工具</div>
        <div class="line"></div>
        <div class="s3a big" style="font-size:92px">论文丢进去</div>
        <div class="s3b big" style="font-size:92px">选个模板</div>
        <div class="s3c accent">一键排版</div>
      </div>

      <!-- 场景4 10.5-14s：图片表格保留 -->
      <div class="scene clip" data-start="10.5" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s4 big" style="font-size:100px">图片表格</div>
        <div class="s4a accent">原样保留</div>
        <div class="s4b mid">只动格式</div>
        <div class="s4c accent" style="font-size:72px">不改你一个字</div>
      </div>

      <!-- 场景5 14-17.5s：Markdown -->
      <div class="scene clip" data-start="14" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s5 big" style="font-size:100px">Markdown 也能排</div>
        <div class="s5a mid">表格 · 代码块 · LaTeX 公式</div>
        <div class="s5b accent">工科生友好</div>
      </div>

      <!-- 场景6 17.5-21s：自动质检 + 报告 -->
      <div class="scene clip" data-start="17.5" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s6 big" style="font-size:100px">排完自动质检</div>
        <div class="s6a accent">生成《改动报告》</div>
        <div class="s6b mid">改了啥、覆盖率多少</div>
        <div class="s6c big" style="font-size:88px">一目了然</div>
      </div>

      <!-- 场景7 21-24.5s：本地运行 -->
      <div class="scene clip" data-start="21" data-duration="3.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s7 big" style="font-size:96px">论文不离开你的电脑</div>
        <div class="s7a accent">断网也能用</div>
        <div class="s7b small">不上传、不采集</div>
      </div>

      <!-- 场景8 24.5-30s：引流 -->
      <div class="scene clip" data-start="24.5" data-duration="5.5" data-track-index="0">
        <div class="accent-bar"></div>
        <div class="s8 big" style="font-size:96px">开源在 GitHub</div>
        <div class="s8a accent" style="font-size:88px">免费测试中</div>
        <div class="s8b mid">私信我，一人一个码</div>
        <div class="s8c small">DocFormatTool · 论文排版引擎</div>
      </div>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 场景1
      tl.from(".s1", { opacity: 0, y: 80, duration: 0.6 }, 0.4)
        .from(".s1a", { opacity: 0, y: 80, scale: 0.9, duration: 0.6 }, 1.0);
      // 场景2
      tl.from(".s2", { opacity: 0, x: -60, duration: 0.5 }, 3.8)
        .from(".s2a", { opacity: 0, x: -60, duration: 0.5 }, 4.3)
        .from(".s2b", { opacity: 0, y: 40, duration: 0.5 }, 4.8)
        .from(".s2c", { opacity: 0, y: 40, duration: 0.5 }, 5.6);
      // 场景3
      tl.from(".s3", { opacity: 0, scale: 0.85, duration: 0.6 }, 7.3)
        .from(".line", { scaleX: 0, duration: 0.4 }, 7.8)
        .from(".s3a", { opacity: 0, y: 50, duration: 0.5 }, 8.2)
        .from(".s3b", { opacity: 0, y: 50, duration: 0.5 }, 8.8)
        .from(".s3c", { opacity: 0, y: 50, scale: 1.1, duration: 0.5 }, 9.4);
      // 场景4
      tl.from(".s4", { opacity: 0, y: 60, duration: 0.5 }, 10.8)
        .from(".s4a", { opacity: 0, y: 60, duration: 0.5 }, 11.4)
        .from(".s4b", { opacity: 0, duration: 0.4 }, 12.0)
        .from(".s4c", { opacity: 0, y: 30, duration: 0.5 }, 12.6);
      // 场景5
      tl.from(".s5", { opacity: 0, y: 60, duration: 0.5 }, 14.3)
        .from(".s5a", { opacity: 0, y: 40, duration: 0.5 }, 14.9)
        .from(".s5b", { opacity: 0, scale: 1.1, duration: 0.4 }, 15.7);
      // 场景6
      tl.from(".s6", { opacity: 0, y: 60, duration: 0.5 }, 17.8)
        .from(".s6a", { opacity: 0, y: 60, duration: 0.5 }, 18.4)
        .from(".s6b", { opacity: 0, duration: 0.4 }, 19.0)
        .from(".s6c", { opacity: 0, y: 40, duration: 0.5 }, 19.6);
      // 场景7
      tl.from(".s7", { opacity: 0, y: 60, duration: 0.5 }, 21.3)
        .from(".s7a", { opacity: 0, y: 60, duration: 0.5 }, 21.9)
        .from(".s7b", { opacity: 0, duration: 0.4 }, 22.6);
      // 场景8
      tl.from(".s8", { opacity: 0, y: 60, duration: 0.5 }, 24.8)
        .from(".s8a", { opacity: 0, y: 50, scale: 1.05, duration: 0.5 }, 25.4)
        .from(".s8b", { opacity: 0, y: 40, duration: 0.5 }, 26.0)
        .from(".s8c", { opacity: 0, duration: 0.5 }, 26.8)
        .to(".s8c", { opacity: 0.4, duration: 0.5, yoyo: true, repeat: 3 }, 27.6);

      window.__timelines = window.__timelines || {};
      window.__timelines.promo = tl;
    </script>
  </body>
</html>
